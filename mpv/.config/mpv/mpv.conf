## Video
profile=high-quality
vo=gpu-next
scale-antiring=0.6

# Dither
# This must be set to match your monitor's bit depth
dither-depth = 10

## Behavior (personal preference)
keep-open=yes
reset-on-next-file=pause # Resumes playback when skip to next file
save-position-on-quit=yes

## Screenshots
screenshot-format=png
screenshot-dir="~/Pictures/mpv"
screenshot-template="%F-%p-%n"
screenshot-high-bit-depth=no

## Language Priority
## Sub
## Add enm before eng for honorifics
slang=eng,en
alang=jpn,ja

## Dub
#slang=zxx,eng,en
#alang=eng,en
#subs-with-matching-audio=forced

autofit-larger=80% # Set max window size. Can also set something like "75%" to mean max window size is 75% of screen height/width
autofit-smaller=60% # Set min window size.

no-osd-bar # Hide OSD bar when seeking.
osd-duration=500 # Hide OSD text after x ms.
osd-font='Trebuchet MS'
osd-font-size=24

osc=no # Disables default OSD. Use this option ONLY if you have a custom osc.lua
border = no

volume=80 # Set volume to 100% on startup.
volume-max=100 # Set player max vol to 100%.

script-opts=ytdl_hook-ytdl_path=C:\Users\Gurnoor\scoop\shims\yt-dlp.exe